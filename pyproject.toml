[project]
name = "flash-defi-project"
version = "0.1.0"
description = "Sharia-compliant DeFi yield assistant"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
